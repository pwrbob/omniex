name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run doc tests
        run: cargo test --workspace --doc --locked

  hashcat:
    name: Hashcat conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Fingerprint CPU features
        id: cpu
        run: echo "flags=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache reference hashcat
        uses: actions/cache@v4
        with:
          path: tmp/reference
          key: reference-hashcat-8.0.0-${{ steps.cpu.outputs.flags }}

      - name: Build hashcat 8.0.0
        run: scripts/build-hashcat.sh

      - name: Run hashcat conformance
        env:
          OMNIEX_HASHCAT: ${{ github.workspace }}/tmp/reference/hashcat-8.0.0/hashcat
        run: cargo test -p omniex --test hashcat_conformance --locked -- --ignored --nocapture

  john:
    name: John conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install John build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Fingerprint CPU features
        id: cpu
        run: echo "flags=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache reference John
        uses: actions/cache@v4
        with:
          path: tmp/reference
          key: reference-john-5184bc0b8c105f8c5978b112e723d65b2de3e63e-${{ steps.cpu.outputs.flags }}

      - name: Build John jumbo
        run: scripts/build-john.sh

      - name: Run John conformance
        env:
          OMNIEX_JOHN: ${{ github.workspace }}/tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e/run/john
        run: cargo test -p omniex --test john_conformance --locked -- --ignored --nocapture
