name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Format, lint, docs, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-checks

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run doc tests
        run: cargo test --workspace --doc --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

  hashcat-build:
    name: Build hashcat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fingerprint CPU features
        id: cpu
        run: echo "flags=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache reference hashcat
        uses: actions/cache@v5
        with:
          path: tmp/reference
          key: ${{ runner.os }}-reference-hashcat-8.0.0-${{ hashFiles('scripts/build-hashcat.sh') }}-${{ steps.cpu.outputs.flags }}

      - name: Build hashcat 8.0.0
        run: scripts/build-hashcat.sh

      - name: Upload hashcat
        uses: actions/upload-artifact@v4
        with:
          name: hashcat-8.0.0
          path: |
            tmp/reference/hashcat-8.0.0/hashcat
            tmp/reference/hashcat-8.0.0/hashcat.hcstat2
            tmp/reference/hashcat-8.0.0/libhashcat.so.8
            tmp/reference/hashcat-8.0.0/modules
            tmp/reference/hashcat-8.0.0/OpenCL
          if-no-files-found: error

  hashcat:
    name: Hashcat conformance (${{ matrix.shard }}/4)
    needs: hashcat-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Download hashcat
        uses: actions/download-artifact@v4
        with:
          name: hashcat-8.0.0
          path: tmp/reference/hashcat-8.0.0

      - name: Run hashcat conformance
        env:
          OMNIEX_HASHCAT: ${{ github.workspace }}/tmp/reference/hashcat-8.0.0/hashcat
          LD_LIBRARY_PATH: ${{ github.workspace }}/tmp/reference/hashcat-8.0.0
          OMNIEX_CONFORMANCE_SUBSET: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          OMNIEX_CONFORMANCE_SHARD: ${{ matrix.shard }}
          OMNIEX_CONFORMANCE_SHARDS: 4
          OMNIEX_CONFORMANCE_WORKERS: 4
        run: |
          chmod +x "$OMNIEX_HASHCAT"
          cargo test -p omniex --test hashcat_conformance --locked -- --ignored --nocapture

  john:
    name: John conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install John build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Fingerprint CPU features
        id: cpu
        run: echo "flags=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache reference John
        uses: actions/cache@v5
        with:
          path: tmp/reference
          key: ${{ runner.os }}-reference-john-5184bc0b8c105f8c5978b112e723d65b2de3e63e-${{ hashFiles('scripts/build-john.sh') }}-${{ steps.cpu.outputs.flags }}

      - name: Build John jumbo
        run: scripts/build-john.sh

      - name: Run John conformance
        env:
          OMNIEX_JOHN: ${{ github.workspace }}/tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e/run/john
          OMNIEX_CONFORMANCE_SUBSET: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: cargo test -p omniex --test john_conformance --locked -- --ignored --nocapture
