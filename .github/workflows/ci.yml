name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Check formatting
        run: |
          export TIMEFORMAT='  [time] %3R s'
          time cargo fmt --all --check

      - name: Run Clippy
        run: |
          export TIMEFORMAT='  [time] %3R s'
          time cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Build documentation
        run: |
          export TIMEFORMAT='  [time] %3R s'
          time cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  tests:
    name: Workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Run tests
        run: |
          export TIMEFORMAT='  [time] %3R s'
          time cargo test --workspace --all-targets --locked

      - name: Run doc tests
        run: |
          export TIMEFORMAT='  [time] %3R s'
          time cargo test --workspace --doc --locked

  ui:
    name: Derive UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Run derive UI tests
        run: |
          export TIMEFORMAT='  [time] %3R s'
          time cargo test -p omniex --test ui --locked -- --ignored --nocapture

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: "RUSTSEC-2026-0387,RUSTSEC-2023-0071,RUSTSEC-2026-0543"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan every commit
        run: scripts/secret-scan.sh

  hashcat-build:
    name: Build hashcat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Fingerprint CPU features
        id: cpu
        run: |
          flags="$(grep -m1 '^flags' /proc/cpuinfo)"
          echo "CPU flags: $flags"
          echo "flags=$(printf '%s\n' "$flags" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache reference hashcat
        uses: actions/cache@v5
        with:
          path: tmp/reference
          key: ${{ runner.os }}-reference-hashcat-8.0.0-${{ hashFiles('scripts/build-hashcat.sh') }}-${{ steps.cpu.outputs.flags }}

      - name: Build hashcat 8.0.0
        run: scripts/build-hashcat.sh

      - name: Upload hashcat
        uses: actions/upload-artifact@v7
        with:
          name: hashcat-8.0.0
          path: |
            tmp/reference/hashcat-8.0.0/hashcat
            tmp/reference/hashcat-8.0.0/hashcat.hcstat2
            tmp/reference/hashcat-8.0.0/libhashcat.so.8
            tmp/reference/hashcat-8.0.0/modules
            tmp/reference/hashcat-8.0.0/OpenCL
            tmp/reference/hashcat-8.0.0/tools
          if-no-files-found: error

  john-build:
    name: Build John
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install John build dependencies
        run: scripts/ci-deps.sh build-essential libssl-dev

      - name: Fingerprint CPU features
        id: cpu
        run: |
          flags="$(grep -m1 '^flags' /proc/cpuinfo)"
          echo "CPU flags: $flags"
          echo "flags=$(printf '%s\n' "$flags" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache reference John
        uses: actions/cache@v5
        with:
          path: tmp/reference
          key: ${{ runner.os }}-reference-john-5184bc0b8c105f8c5978b112e723d65b2de3e63e-${{ hashFiles('scripts/build-john.sh') }}-${{ steps.cpu.outputs.flags }}

      - name: Build John jumbo
        run: scripts/build-john.sh

      - name: Upload John
        uses: actions/upload-artifact@v7
        with:
          name: john-5184bc0b8c105f8c5978b112e723d65b2de3e63e
          path: tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e
          if-no-files-found: error

  hashcat:
    name: Hashcat conformance (${{ matrix.shard }}/4)
    needs: [hashcat-build, lint, docs, tests, msrv]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Download hashcat
        uses: actions/download-artifact@v7
        with:
          name: hashcat-8.0.0
          path: tmp/reference/hashcat-8.0.0

      - name: Inspect hashcat runtime
        run: |
          set -x
          HASHCAT="$PWD/tmp/reference/hashcat-8.0.0/hashcat"
          file "$HASHCAT"
          ls -l "$HASHCAT" "$PWD/tmp/reference/hashcat-8.0.0"
          find "$PWD/tmp/reference/hashcat-8.0.0/modules" -maxdepth 1 -type f | wc -l || true
          ldd "$HASHCAT" || true
          "$HASHCAT" --version || true
          uname -a
          nproc
          free -m || true
          ulimit -a || true
          grep -m1 '^flags' /proc/cpuinfo || true

      - name: Run hashcat conformance
        env:
          OMNIEX_HASHCAT: ${{ github.workspace }}/tmp/reference/hashcat-8.0.0/hashcat
          LD_LIBRARY_PATH: ${{ github.workspace }}/tmp/reference/hashcat-8.0.0
          OMNIEX_CONFORMANCE_SUBSET: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          OMNIEX_CONFORMANCE_SHARD: ${{ matrix.shard }}
          OMNIEX_CONFORMANCE_SHARDS: 4
          OMNIEX_CONFORMANCE_WORKERS: 4
          RUST_BACKTRACE: full
        shell: bash
        run: |
          set -o pipefail
          export TIMEFORMAT='  [time] %3R s'
          chmod +x "$OMNIEX_HASHCAT"
          time cargo test -p omniex --test hashcat_conformance --locked -- --ignored --nocapture 2>&1 \
            | tee "hashcat-conformance-${{ matrix.shard }}.log"
          time cargo test -p omniex --test extract_cracker_e2e --locked -- --ignored --nocapture \
            hashcat_loads_extracted_artifacts 2>&1 \
            | tee -a "hashcat-conformance-${{ matrix.shard }}.log"

      - name: Upload hashcat conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hashcat-conformance-${{ matrix.shard }}-diagnostics
          path: |
            hashcat-conformance-${{ matrix.shard }}.log
            target/tmp/hashcat-conformance
            target/tmp/extract-cracker-e2e-hashcat
          if-no-files-found: ignore
          retention-days: 7

  john:
    needs: [john-build, lint, docs, tests, msrv]
    name: John conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"

      - name: Install sample extraction dependencies
        run: |
          scripts/ci-deps.sh \
            build-essential libssl-dev python3-dev python3-venv libdb-dev \
            libcompress-raw-lzma-perl p7zip-full tshark

      - name: Install Python test dependencies
        run: |
          uv venv .venv --python python3
          uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Download John
        uses: actions/download-artifact@v7
        with:
          name: john-5184bc0b8c105f8c5978b112e723d65b2de3e63e
          path: tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e

      - name: Mark John executable
        run: chmod -R +x tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e/run

      - name: Run John conformance
        env:
          OMNIEX_JOHN: ${{ github.workspace }}/tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e/run/john
          OMNIEX_CONFORMANCE_SUBSET: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          export TIMEFORMAT='  [time] %3R s'
          time cargo test -p omniex --test john_conformance --locked -- --ignored --nocapture
          time cargo test -p omniex --test extract_cracker_e2e --locked -- --ignored --nocapture \
            john_loads_extracted_artifacts

      - name: Run real-file extractor tests
        env:
          OMNIEX_JOHN: ${{ github.workspace }}/tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e/run/john
        run: |
          export TIMEFORMAT='  [time] %3R s'
          time cargo test -p omniex --test extract_real_files --locked -- --ignored --nocapture

  external-samples:
    needs: [john-build, hashcat-build, lint, docs, tests, msrv]
    name: External samples (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [fixtures, john-samples, archives, formats]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"

      - name: Install sample extraction dependencies
        run: |
          scripts/ci-deps.sh \
            build-essential libssl-dev python3-dev python3-venv libdb-dev \
            libcompress-raw-lzma-perl tshark p7zip-full

      - name: Install Python test dependencies
        run: |
          uv venv .venv --python python3
          uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.job }}-

      - name: Download John
        uses: actions/download-artifact@v7
        with:
          name: john-5184bc0b8c105f8c5978b112e723d65b2de3e63e
          path: tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e

      - name: Download hashcat
        uses: actions/download-artifact@v7
        with:
          name: hashcat-8.0.0
          path: tmp/reference/hashcat-8.0.0

      - name: Mark downloaded tools executable
        run: |
          chmod -R +x tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e/run
          chmod +x tmp/reference/hashcat-8.0.0/hashcat

      - name: Cache external samples
        uses: actions/cache@v5
        with:
          path: tmp/external-samples
          key: ${{ runner.os }}-external-samples-${{ matrix.shard }}-${{ hashFiles('scripts/external-samples/repos/**/manifest.toml', 'scripts/external-samples/locks/*.toml') }}

      - name: Run external samples
        env:
          OMNIEX_JOHN: ${{ github.workspace }}/tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e/run/john
          OMNIEX_JOHN_RUN: ${{ github.workspace }}/tmp/reference/john-5184bc0b8c105f8c5978b112e723d65b2de3e63e/run
          OMNIEX_HASHCAT: ${{ github.workspace }}/tmp/reference/hashcat-8.0.0/hashcat
        run: scripts/ci-external-samples.sh "${{ matrix.shard }}"
