name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build musl artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-status.sh "$GITHUB_SHA" --wait 900

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install musl toolchain
        run: |
          scripts/ci-deps.sh musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Check tag and version
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Check static linkage
        run: |
          file target/x86_64-unknown-linux-musl/release/omniex
          if readelf -l target/x86_64-unknown-linux-musl/release/omniex | grep -q "INTERP"; then
            echo "musl binary is dynamically linked" >&2
            exit 1
          fi
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release/omniex:/omniex:ro" debian:12 /omniex --version

      - name: Package release artifacts
        run: scripts/package-release.sh "$GITHUB_REF_NAME" x86_64-unknown-linux-musl

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: omniex-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [build]
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: omniex-${{ github.ref_name }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
