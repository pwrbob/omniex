[workspace]
resolver = "3"
members = ["omniex-core", "omniex-macros"]
exclude = ["tmp"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
omniex-core = { path = "omniex-core" }
omniex-macros = { path = "omniex-macros" }

[package]
name = "omniex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
byteorder = "1"
clap = { version = "4", features = ["derive"] }
# 7.2.2 uses let chains, which Rust 1.85 rejects.
comfy-table = "=7.2.1"
hex = "0.4"
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
memchr = "2"
omniex-core.workspace = true
omniex-macros.workspace = true
pgp = "0.10"
roxmltree = "0.20"
serde_json = "1"
sha2 = "0.10"
textwrap = "0.16"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
terminal_size = "0.4"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
toml = "=1.1.8"
trybuild = "1"
