[workspace]
resolver = "3"
members = ["omniex-core", "omniex-macros"]
exclude = ["tmp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
omniex-core = { path = "omniex-core" }
omniex-macros = { path = "omniex-macros" }

[package]
name = "omniex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
omniex-core.workspace = true
omniex-macros.workspace = true
serde_json = "1"
terminal_size = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
trybuild = "1"
