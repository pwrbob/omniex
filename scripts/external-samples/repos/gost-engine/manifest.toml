id = "gost-engine"
repo = "https://github.com/gost-engine/engine"
commit = "af2b7e69e855572202420ffc36bae06ccd70796b"
notes = "OpenSSL enc test payloads from the GOST engine Tcl tests"

[fetch]
mode = "file"

# The salted envelope does not record its cipher or digest. The reference is
# told to use the AES-256-CBC and SHA-256 defaults the extractor assumes. The
# CBC/CFB/CNT samples use GOST block and stream ciphers, which omniex refuses
# because John's openssl-enc format only serializes AES-128 and AES-256.
[[case]]
name = "enc-aes"
path = "tcl_tests/aes0.enc"
slug = "openssl-enc"
reference = "john:openssl2john.py"
args = ["-m", "2"]
format = "john"
