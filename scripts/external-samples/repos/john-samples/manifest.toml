[[case]]
name = "oldoffice-unicode"
path = "Office/вα¢к тσ єηgℓαη∂.doc"
slug = "oldoffice"
reference = "john:office2john.py"
format = "hashcat"

# The LibreOffice ODF samples are encrypted, but office2john reports them as
# unencrypted, so no reference serialization is available.

[[case]]
name = "odf-{path}"
glob = "Office/Office_Secrets/**/*.odt"
slug = "odf"
