# accounting samples need a different attack.
[[case]]
name = "radius-pap"
path = "Radius/radius-sample-5.pcap"
slug = "radius"
reference = "structural"
format = "john"
omniex_args = [
  "--companion",
  "radius-secret={root}/scripts/external-samples/sidecars/radius/secret-5.txt",
]

