id = "john-samples"
repo = "https://github.com/openwall/john-samples"
commit = "a2f3a3ed7819ce94f8280b0bbfc23ba576817cce"
notes = "Openwall John sample artifacts, compared against the pinned John reference scripts. Cases cover every artifact the registered extractors can parse; the remaining files are support data (password lists, keyfiles, logs, readmes), Apple DMG sparsebundle metadata outside the token, encrypted QCOW2 and EFS metadata, LastPass XML exports and ECB-only browser records, unencrypted or XOR-obfuscated Office documents, Mozilla cert8/null key3 databases, and network formats without an extractor (ACE, ALZip, EAPOL, EFS, EIGRP, Gadu-Gadu, IKE, MongoDB, Mosquitto, Padlock, EAP-only RADIUS, Restic, VRRP)."

[fetch]
mode = "file"

[[case]]
name = "zip-aes-{base}"
glob = "ZIP/winzip-AES-*.zip"
slug = "winzip"
reference = "john:zip2john"
format = "john"

[[case]]
name = "zip-pkzip-{base}"
glob = "ZIP/zip*_password.zip"
slug = "pkzip"
reference = "john:zip2john"
format = "john"

[[case]]
name = "pdf-{base}"
glob = "PDF/pdf_samples/test-*.pdf"
slug = "pdf"
reference = "john:pdf2john.pl"
format = "john"

[[case]]
name = "office-{base}"
glob = "Office/Office-2013-samples/*.docx"
slug = "office"
reference = "john:office2john.py"
format = "john"

[[case]]
name = "keepass-{base}"
path = "KeePass/kdbx4/test_chacha.kdbx"
slug = "keepass4"
reference = "john:keepass2john"
format = "john"

[[case]]
name = "keepass-argon2id"
path = "KeePass/kdbx4/a2id.kdbx"
slug = "keepass4"
reference = "john:keepass2john"
format = "john"

[[case]]
name = "rar3-headers-encrypted"
path = "RAR/hp0.rar"
slug = "rar3hp"
reference = "john:rar2john"
format = "john"

# The plain image and the header_v1 layouts are not encrcdsa v2, so the
# DMG payload reference cannot extract them.
[[case]]
name = "dmg-{base}"
glob = "Apple_DMG/*.dmg"
slug = "dmg-payload"
reference = "john:dmg2john.py"
format = "john"
exclude = ["Apple_DMG/HFS+J-APM-plain.dmg"]

[[case]]
name = "dmg-cdr-{base}"
glob = "Apple_DMG/*.cdr"
slug = "dmg-payload"
reference = "john:dmg2john.py"
format = "john"

[[case]]
name = "dmg-sparseimage-{base}"
glob = "Apple_DMG/*.sparseimage"
slug = "dmg-payload"
reference = "john:dmg2john.py"
format = "john"
[[case]]
name = "dmg-sparsebundle-{dir}"
glob = "Apple_DMG/*.sparsebundle/token"
slug = "dmg-payload"
reference = "john:dmg2john"
reference_path = "{dir}/"
format = "john"
companions = ["{dir}/bands/0"]
omniex_args = ["--companion", "data={artifact_dir}/bands/0"]

[[case]]
name = "truecrypt-{base}"
glob = "TrueCrypt/tc-*"
slug = "truecrypt"
reference = "hashcat:truecrypt2hashcat.py"
format = "hashcat"

[[case]]
name = "veracrypt-standard"
path = "VeraCrypt/VC-STD-Volume/Test1.vc"
slug = "veracrypt"
reference = "hashcat:veracrypt2hashcat.py"
format = "hashcat"

# Virtual disk containers: the reference also reports clear and recovery VMKs.
[[case]]
name = "bitlocker-vdi-{base}"
glob = "BitLocker/*.vdi"
slug = "bitlocker"
reference = "john:bitlocker2john"
args = ["-i"]
omniex_args = ["--opt", "deep"]
format = "john"
reference_subset = true

# The efs-*.vdi images hold EFS volumes, not BitLocker, so they are excluded.
[[case]]
name = "bitlocker-vdi-{base}"
glob = "BitLocker/encryption-jungle/disks-v1/*.vdi"
slug = "bitlocker"
reference = "john:bitlocker2john"
args = ["-i"]
omniex_args = ["--opt", "deep"]
format = "john"
reference_subset = true
exclude = [
  "BitLocker/encryption-jungle/disks-v1/efs-1.vdi",
  "BitLocker/encryption-jungle/disks-v1/efs-2.vdi",
  "BitLocker/encryption-jungle/disks-v1/efs-3.vdi",
]

