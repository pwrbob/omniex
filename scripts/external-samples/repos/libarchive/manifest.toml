reference = "john:zip2john"
format = "john"
decode = "uu"

[[case]]
name = "winzip-aes256"
path = "libarchive/test/test_read_format_zip_winzip_aes256.zip.uu"
slug = "winzip"
reference = "john:zip2john"
format = "john"
decode = "uu"

[[case]]
name = "winzip-aes256-stored"
path = "libarchive/test/test_read_format_zip_winzip_aes256_stored.zip.uu"
