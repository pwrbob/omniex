id = "libarchive"
repo = "https://github.com/libarchive/libarchive"
commit = "d0bf2da07ebaa3964090ee936edea538d1602449"
notes = "Encrypted ZIP fixtures stored as uuencoded reference data"

[fetch]
mode = "file"

[[case]]
name = "winzip-aes128"
path = "libarchive/test/test_read_format_zip_winzip_aes128.zip.uu"
slug = "winzip"
reference = "john:zip2john"
format = "john"
decode = "uu"

