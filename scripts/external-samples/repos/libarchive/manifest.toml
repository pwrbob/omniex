id = "libarchive"
repo = "https://github.com/libarchive/libarchive"
commit = "d0bf2da07ebaa3964090ee936edea538d1602449"
notes = "Encrypted ZIP fixtures stored as uuencoded reference data"

[fetch]
mode = "file"

