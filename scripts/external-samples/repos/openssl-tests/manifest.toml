id = "openssl-tests"
repo = "https://github.com/openssl/openssl"
commit = "be36a92f25fd393dfc737642b88054fd93202962"
notes = "Encrypted PKCS#8 keys and PKCS#12 bundles from OpenSSL's test certificates"

[fetch]
mode = "file"

[[case]]
name = "key-pass-12345"
path = "test/certs/key-pass-12345.pem"
slug = "pkcs8-pbes2"
reference = "john:pem2john.py"
format = "john"

[[case]]
name = "v3-certs-rc2"
path = "test/certs/v3-certs-RC2.p12"
slug = "pfx"
reference = "john:pfx2john.py"
format = "john"

[[case]]
name = "v3-certs-tdes"
path = "test/certs/v3-certs-TDES.p12"
slug = "pfx"
reference = "john:pfx2john.py"
format = "john"

[[case]]
name = "shibboleth"
path = "test/shibboleth.pfx"
slug = "pfx"
reference = "john:pfx2john.py"
format = "john"

[[case]]
name = "cmp-mock-new-pass-12345"
path = "test/recipes/80-test_cmp_http_data/Mock/new_pass_12345.key"
slug = "pkcs8-pbes2"
reference = "john:pem2john.py"
format = "john"

[[case]]
name = "pkcs12-java-skey"
path = "test/recipes/80-test_pkcs12_data/java-skey.p12"
slug = "pfx"
reference = "john:pfx2john.py"
format = "john"

[[case]]
name = "pkcs12-multi-skey"
path = "test/recipes/80-test_pkcs12_data/multi-skey.p12"
slug = "pfx"
reference = "john:pfx2john.py"
format = "john"

[[case]]
name = "pkcs12-mismatched-key-pass"
path = "test/recipes/80-test_pkcs12_data/mismatched_key_pass.p12"
slug = "pfx"
reference = "john:pfx2john.py"
format = "john"
